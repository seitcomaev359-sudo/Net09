<!DOCTYPE html>

    width: 90%;
    max-width: 420px;
    margin: 15px auto;
    padding: 20px;
    background: rgba(255,255,255,0.06);
    border-radius: 18px;
    backdrop-filter: blur(12px);
    box-shadow: 0 0 25px rgba(0,240,255,0.15);

.button {
    display:block;
    margin-top:10px;
    padding:12px;

<body>

<div class="header">
    <div class="title">⚡ NET09 VPN PRO</div>
</div>

<div class="card">
    <p>👤 TG:SEIT099</p>
    <p>📌 Статус: АКТИВНА</p>
    <p>⏳ Срок: НАВСЕГДА</p>
    <p>📊 Трафик: ∞</p>

    <a class="button" href="https://apps.apple.com/ru/app/incy/id6756943388">
        📲 Установить INCY

    <a class="button" href="#" onclick="copySub()">

    </a>

    <a class="button" href="#" onclick="openVPN()">
        🚀 Открыть в VPN
    </a>

</div>

<script>
const SUB = "https://raw.githubusercontent.com/seitcomaev359-sudo/Net09/Boza09/Get.txt/Test09";

// копирование
function copySub(){
    navigator.clipboard.writeText(SUB);
    alert("Подписка скопирована");
}

// попытка открыть VPN приложение
function openVPN(){
    window.location.href = "incy://import?url=" + encodeURIComponent(SUB);

    setTimeout(()=>{
        window.location.href = SUB;
    }, 1200);
}

// QR код
const qrImg = document.createElement("img");
qrImg.src = "https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=" + encodeURIComponent(SUB);
document.getElementById("qr").appendChild(qrImg);
</script>
