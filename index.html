<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ultra VPN</title>

<style>
body{
    margin:0;
    font-family:-apple-system, BlinkMacSystemFont, Arial;
    background: radial-gradient(circle at top, #0a0f1a, #000);
    color:#fff;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.card{
    width:92%;
    max-width:420px;
    padding:28px;
    border-radius:24px;
    background: rgba(255,255,255,0.06);
    backdrop-filter: blur(20px);
    box-shadow: 0 0 50px rgba(0,240,255,0.15);
}

/* TITLE */
.title{
    text-align:center;
    font-size:20px;
    color:#00f0ff;
    text-shadow:0 0 15px #00f0ff;
    margin-bottom:20px;
}

/* ROWS */
.row{
    display:flex;
    justify-content:space-between;
    padding:10px 0;
    border-bottom:1px solid rgba(255,255,255,0.07);
    font-size:14px;
}

.label{ opacity:0.6; }
.value{ font-weight:600; }

.infinity{
    color:#00f0ff;
    font-weight:700;
}

/* BADGE */
.badge{
    text-align:center;
    margin-top:10px;
    font-size:12px;
    opacity:0.7;
}

/* BUTTON */
.btn{
    margin-top:18px;
    display:block;
    text-align:center;
    padding:12px;
    border-radius:14px;
    background: linear-gradient(135deg,#00f0ff,#0066ff);
    color:#000;
    font-weight:bold;
    cursor:pointer;
    user-select:none;
}

.btn:active{
    transform:scale(0.98);
}
</style>
</head>

<body>

<div class="card">

    <div class="title">🔐 ULTRA PREMIUM VPN</div>

    <div class="row">
        <div class="label">Имя пользователя</div>
        <div class="value">TG:SEIT099</div>
    </div>

    <div class="row">
        <div class="label">Статус</div>
        <div class="value">Активна</div>
    </div>

    <div class="row">
        <div class="label">Трафик</div>
        <div class="value infinity">∞ GB</div>
    </div>

    <div class="row">
        <div class="label">Дата доступа</div>
        <div class="value">07.09.2026</div>
    </div>

    <div class="badge">
        Premium encrypted VPN access • Secure tunnel
    </div>

    <div class="btn" onclick="copySub()">
        📋 Копировать подписку
    </div>

</div>

<script>

const SUB = "https://raw.githubusercontent.com/seitcomaev359-sudo/Net09/Boza09/Get.txt/Test09";

function copySub(){
    navigator.clipboard.writeText(SUB);
    alert("Подписка скопирована");
}

</script>

</body>
</html>
