<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NET09 VPN PRO</title>

<!-- PWA MANIFEST INLINE -->
<link rel="manifest" href="data:application/manifest+json,{
  &quot;name&quot;:&quot;NET09 VPN PRO&quot;,
  &quot;short_name&quot;:&quot;NET09 VPN&quot;,
  &quot;start_url&quot;:&quot;.&quot;,
  &quot;display&quot;:&quot;standalone&quot;,
  &quot;background_color&quot;:&quot;#000000&quot;,
  &quot;theme_color&quot;:&quot;#00f0ff&quot;,
  &quot;icons&quot;:[{
    &quot;src&quot;:&quot;icon.png&quot;,
    &quot;sizes&quot;:&quot;512x512&quot;,
    &quot;type&quot;:&quot;image/png&quot;
  }]
}">

<style>
body {
    margin:0;
    font-family: Arial;
    background: radial-gradient(circle at top, #0b0f1a, #000);
    color:white;
    text-align:center;
}

.header { padding:25px; }

.title {
    font-size:26px;
    color:#00f0ff;
    text-shadow:0 0 20px #00f0ff;
}

.connect {
    width:190px;
    height:190px;
    margin:30px auto;
    border-radius:50%;
    background: linear-gradient(145deg, #00f0ff, #0066ff);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:20px;
    font-weight:bold;
    color:black;
    box-shadow:0 0 50px #00f0ff;
    cursor:pointer;
}

.connect:active { transform:scale(0.95); }

.status {
    margin-top:10px;
    font-size:14px;
    opacity:0.8;
}

.server button {
    margin:5px;
    padding:10px 14px;
    border-radius:10px;
    border:none;
    background:#111;
    color:white;
}

.server button:hover {
    background:#00f0ff;
    color:black;
}

.card {
    width:90%;
    max-width:420px;
    margin:20px auto;
    padding:15px;
    background:rgba(255,255,255,0.05);
    border-radius:15px;
    backdrop-filter: blur(10px);
}

.btn {
    display:block;
    margin-top:10px;
    padding:12px;
    border-radius:12px;
    background:#00f0ff;
    color:black;
    font-weight:bold;
    text-decoration:none;
    cursor:pointer;
}

.small {
    font-size:12px;
    opacity:0.7;
}
</style>
</head>

<body>

<div class="header">
    <div class="title">⚡ NET09 VPN PRO</div>
</div>

<div class="connect" onclick="connectVPN()">
CONNECT
</div>

<div class="status" id="status">DISCONNECTED</div>

<div class="server">
    <button onclick="setServer('EU 🇩🇪')">EU</button>
    <button onclick="setServer('US 🇺🇸')">US</button>
    <button onclick="setServer('RU 🇷🇺')">RU</button>
</div>

<div class="card">
    <p>👤 TG:SEIT099</p>
    <p>📌 STATUS: ACTIVE</p>
    <p>⏳ LIFETIME</p>
    <p>📊 ∞ TRAFFIC</p>

    <a class="btn" onclick="openSub()">➕ Добавить подписку</a>
    <a class="btn" onclick="copySub()">📋 Копировать подписку</a>

    <p class="small">Откроется VPN клиент → импорт вручную</p>
</div>

<script>

const SUB = "https://raw.githubusercontent.com/seitcomaev359-sudo/Net09/Boza09/Get.txt/Test09";

let server = "EU 🇩🇪";

function setServer(s){
    server = s;
    alert("Выбран сервер: " + s);
}

function connectVPN(){
    document.getElementById("status").innerText = "CONNECTING...";

    setTimeout(()=>{
        document.getElementById("status").innerText = "CONNECTED • " + server;
    },1500);

    window.location.href = SUB;
}

function openSub(){
    window.location.href = SUB;
}

function copySub(){
    navigator.clipboard.writeText(SUB);
    alert("Скопировано");
}

</script>

</body>
</html>
