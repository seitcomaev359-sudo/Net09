<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VPN PRO+</title>

<link rel="manifest" href="manifest.json">

<style>
body {
  margin:0;
  font-family: Arial;
  background:#05070f;
  color:#fff;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}

.panel {
  width:360px;
  padding:20px;
  border-radius:20px;
  background:rgba(255,255,255,0.05);
  box-shadow:0 0 40px rgba(0,255,255,0.2);
  backdrop-filter:blur(10px);
}

h2 { text-align:center; color:#00f5ff; }

.card {
  background:rgba(255,255,255,0.05);
  padding:15px;
  border-radius:15px;
  margin:10px 0;
}

.server {
  display:flex;
  justify-content:space-between;
  padding:8px;
  border-radius:10px;
  cursor:pointer;
}

.server:hover {
  background:rgba(0,255,255,0.1);
}

.connect {
  width:100%;
  padding:15px;
  border:none;
  border-radius:50px;
  font-size:18px;
  background:linear-gradient(90deg,#00f5ff,#7a5cff);
  color:#000;
  cursor:pointer;
  margin-top:10px;
  transition:0.3s;
}

.connect.active {
  box-shadow:0 0 30px #00f5ff;
  transform:scale(1.05);
}

.small {
  font-size:12px;
  opacity:0.7;
}

.btn {
  padding:10px;
  border:none;
  border-radius:10px;
  margin-top:8px;
  width:100%;
  cursor:pointer;
  background:#111;
  color:#fff;
}

.btn:hover {
  background:#222;
}
</style>
</head>

<body>

<div class="panel">

<h2>VPN PRO+</h2>

<div class="card">
<b>USER:</b> TG:SEIT099<br>
<b>STATUS:</b> 🟢 Active<br>
<b>SUB:</b> 07.09.2026<br>
<b>TRAFFIC:</b> ∞ GB
</div>

<div class="card">
<div class="server" onclick="selectServer('Germany')">🇩🇪 Germany <span>24ms</span></div>
<div class="server" onclick="selectServer('USA')">🇺🇸 USA <span>60ms</span></div>
<div class="server" onclick="selectServer('Japan')">🇯🇵 Japan <span>110ms</span></div>
</div>

<div class="card">
<div class="small">Selected:</div>
<div id="selected">Germany</div>
</div>

<button class="connect" id="btn" onclick="connectVPN()">CONNECT</button>

<div class="card">
<button class="btn" onclick="copySub()">📋 Copy Subscription</button>
<button class="btn" onclick="openSub()">➕ Add Subscription</button>
</div>

</div>

<audio id="sound">
<source src="https://www.soundjay.com/buttons/sounds/button-16.mp3">
</audio>

<script>
let connected = false;

const subURL = atob("aHR0cHM6Ly9yYXcuZ2l0aHVidXNlcmNvbnRlbnQuY29tL3NlaXRjb21hZXYzNTktc3Vkb2wvTmV0MDkvQm96YTkvR2V0LnR4dC9UZXN0MDk=");

function selectServer(name){
  document.getElementById("selected").innerText = name;
}

function connectVPN(){
  let btn = document.getElementById("btn");
  let sound = document.getElementById("sound");

  connected = !connected;

  if(connected){
    btn.innerText = "CONNECTED";
    btn.classList.add("active");
    sound.play();
  } else {
    btn.innerText = "CONNECT";
    btn.classList.remove("active");
  }
}

function copySub(){
  navigator.clipboard.writeText(subURL);
  alert("Copied!");
}

function openSub(){
  window.open(subURL, "_blank");
}
</script>

</body>
</html>
