<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VPN Subscription</title>

<style>
body{
    margin:0;
    font-family: -apple-system, BlinkMacSystemFont, Arial;
    background: radial-gradient(circle at top, #0b0f1a, #000);
    color:#fff;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.card{
    width:90%;
    max-width:420px;
    padding:25px;
    border-radius:20px;
    background: rgba(255,255,255,0.06);
    backdrop-filter: blur(12px);
    box-shadow: 0 0 30px rgba(0,240,255,0.15);
    text-align:center;
}

.title{
    font-size:20px;
    color:#00f0ff;
    text-shadow:0 0 10px #00f0ff;
    margin-bottom:10px;
}

.info{
    font-size:13px;
    opacity:0.8;
    margin-bottom:15px;
}

.link{
    font-size:12px;
    word-break:break-all;
    padding:12px;
    border-radius:12px;
    background: rgba(0,0,0,0.4);
    border:1px solid rgba(0,240,255,0.2);
    margin-bottom:20px;
    color:#bffcff;
}

.btn{
    display:inline-block;
    padding:12px 18px;
    border-radius:12px;
    background: linear-gradient(135deg,#00f0ff,#0066ff);
    color:#000;
    font-weight:bold;
    cursor:pointer;
    box-shadow:0 0 20px rgba(0,240,255,0.4);
}

.btn:active{
    transform:scale(0.97);
}

.small{
    margin-top:15px;
    font-size:11px;
    opacity:0.6;
}
</style>
</head>

<body>

<div class="card">

    <div class="title">🔐 VPN Subscription</div>

    <!-- 👇 ТВОЁ ИМЯ + ДАТА -->
    <div class="info">
        👤 TG: SEIT099<br>
        📅 05.06.2026
    </div>

    <div class="link" id="sub">
        https://raw.githubusercontent.com/seitcomaev359-sudo/Net09/Boza09/Get.txt/Test09
    </div>

    <div class="btn" onclick="copyLink()">
        📋 Copy Link
    </div>

    <div class="small">
        Open VPN app and paste subscription
    </div>

</div>

<script>

function copyLink(){
    const text = document.getElementById("sub").innerText;
    navigator.clipboard.writeText(text);
    alert("Link copied");
}

</script>

</body>
</html>
