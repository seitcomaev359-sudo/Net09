<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PRO VPN</title>

<style>
body{
    margin:0;
    font-family:-apple-system, BlinkMacSystemFont, Arial;
    background: radial-gradient(circle at top, #0a0f1a, #000);
    color:#fff;
    overflow:hidden;
}

/* LOGIN */
.login{
    position:absolute;
    width:100%;
    height:100%;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
}

.input{
    padding:12px;
    margin:6px;
    border-radius:10px;
    border:none;
    width:200px;
}

.loginBtn{
    padding:12px 20px;
    margin-top:10px;
    border:none;
    border-radius:10px;
    background:#00f0ff;
    color:#000;
    font-weight:bold;
}

/* APP */
.app{
    display:none;
    height:100vh;
    justify-content:center;
    align-items:center;
    flex-direction:column;
}

.card{
    width:90%;
    max-width:420px;
    padding:25px;
    border-radius:20px;
    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(15px);
    text-align:center;
}

/* CONNECT BUTTON */
.connect{
    width:160px;
    height:160px;
    border-radius:50%;
    background: linear-gradient(145deg,#00f0ff,#0066ff);
    display:flex;
    justify-content:center;
    align-items:center;
    font-weight:bold;
    color:black;
    margin:20px auto;
    cursor:pointer;
    transition:0.3s;
}

.connect.active{
    box-shadow:0 0 60px #00f0ff;
    transform:scale(1.05);
}

/* SERVER */
.server{
    margin-top:10px;
}

.server button{
    margin:5px;
    padding:8px 12px;
    border-radius:10px;
    border:none;
    background:#111;
    color:white;
}

.server button:hover{
    background:#00f0ff;
    color:black;
}

/* STATUS */
.status{
    font-size:13px;
    opacity:0.8;
    margin-top:10px;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div class="login" id="login">
    <input class="input" id="user" placeholder="Username">
    <input class="input" type="password" id="pass" placeholder="Password">
    <button class="loginBtn" onclick="login()">LOGIN</button>
</div>

<!-- APP -->
<div class="app" id="app">

    <div class="card">

        <h3>PRO VPN</h3>

        <div class="connect" id="connect" onclick="connectVPN()">
            CONNECT
        </div>

        <div class="server">
            <button onclick="setServer('EU 🇩🇪')">EU</button>
            <button onclick="setServer('US 🇺🇸')">US</button>
            <button onclick="setServer('RU 🇷🇺')">RU</button>
        </div>

        <div class="status" id="status">Status: DISCONNECTED</div>

    </div>

</div>

<script>

let server = "EU 🇩🇪";

// LOGIN
function login(){
    document.getElementById("login").style.display="none";
    document.getElementById("app").style.display="flex";
}

// SERVER
function setServer(s){
    server = s;
    alert("Server: " + s);
}

// CONNECT ANIMATION + SOUND
function connectVPN(){

    let btn = document.getElementById("connect");
    let status = document.getElementById("status");

    btn.classList.add("active");
    status.innerText = "CONNECTING...";

    // sound (simple beep)
    let audio = new Audio("https://actions.google.com/sounds/v1/alarms/beep_short.ogg");
    audio.play();

    setTimeout(()=>{
        status.innerText = "SECURE • " + server;
    },2000);
}

</script>

</body>
</html>
