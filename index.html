<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Secure VPN Panel</title>

<style>
body{
    margin:0;
    font-family:-apple-system, BlinkMacSystemFont, Arial;
    background: radial-gradient(circle at top, #0a0f1a, #000);
    color:#fff;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

/* MAIN CARD */
.card{
    width:92%;
    max-width:420px;
    padding:28px;
    border-radius:22px;
    background: rgba(255,255,255,0.06);
    backdrop-filter: blur(18px);
    box-shadow: 0 0 40px rgba(0,240,255,0.12);
}

/* TITLE */
.title{
    text-align:center;
    font-size:20px;
    color:#00f0ff;
    margin-bottom:20px;
    letter-spacing:1px;
}

/* INFO ROWS */
.row{
    display:flex;
    justify-content:space-between;
    padding:10px 0;
    border-bottom:1px solid rgba(255,255,255,0.06);
    font-size:14px;
}

.label{
    opacity:0.6;
}

.value{
    font-weight:600;
}

.status{
    color:#00ff99;
}

/* PROGRESS BAR */
.bar{
    margin-top:10px;
    height:8px;
    background:#111;
    border-radius:10px;
    overflow:hidden;
}

.fill{
    height:100%;
    width:30%;
    background:linear-gradient(90deg,#00f0ff,#0066ff);
}

/* BUTTON */
.btn{
    margin-top:18px;
    display:block;
    text-align:center;
    padding:12px;
    border-radius:12px;
    background:linear-gradient(135deg,#00f0ff,#0066ff);
    color:#000;
    font-weight:bold;
    cursor:pointer;
    user-select:none;
}

.btn:active{
    transform:scale(0.98);
}

/* FOOTER */
.small{
    text-align:center;
    margin-top:12px;
    font-size:11px;
    opacity:0.5;
}
</style>
</head>

<body>

<div class="card">

    <div class="title">🔐 SECURE VPN ACCOUNT</div>

    <div class="row">
        <div class="label">User</div>
        <div class="value">tg5520854853</div>
    </div>

    <div class="row">
        <div class="label">Status</div>
        <div class="value status">Active</div>
    </div>

    <div class="row">
        <div class="label">Expires</div>
        <div class="value">07 Sep 2026</div>
    </div>

    <div class="row">
        <div class="label">Traffic</div>
        <div class="value">12.10 / 800 GB</div>
    </div>

    <div class="bar">
        <div class="fill"></div>
    </div>

    <div class="btn" onclick="copyLink()">
        📋 Copy Subscription
    </div>

    <div class="small">
        Secure VPN • Premium encrypted access
    </div>

</div>

<script>

const SUB = "https://raw.githubusercontent.com/seitcomaev359-sudo/Net09/Boza09/Get.txt/Test09";

function copyLink(){
    navigator.clipboard.writeText(SUB);
    alert("Subscription copied");
}

</script>

</body>
</html>
