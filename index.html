<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VPN Panel</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:-apple-system,BlinkMacSystemFont,sans-serif;
}

body{
background:#07111f;
min-height:100vh;
padding:20px;
color:white;
}

.logo{
font-size:36px;
font-weight:700;
color:#3dcfff;
margin-bottom:20px;
text-align:center;
}

.card{
background:rgba(17,24,39,.95);
border:1px solid rgba(255,255,255,.05);
border-radius:25px;
padding:20px;
box-shadow:0 0 30px rgba(0,255,255,.08);
}

.user{
display:flex;
align-items:center;
gap:15px;
margin-bottom:20px;
}

.check{
width:50px;
height:50px;
border-radius:50%;
background:#0d3f37;
display:flex;
align-items:center;
justify-content:center;
font-size:24px;
color:#44ff99;
}

.name{
font-size:34px;
font-weight:700;
}

.exp{
opacity:.7;
font-size:15px;
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
}

.box{
padding:16px;
border-radius:18px;
backdrop-filter:blur(15px);
}

.blue{
border:1px solid #2979ff;
background:rgba(41,121,255,.12);
}

.green{
border:1px solid #00e676;
background:rgba(0,230,118,.12);
}

.red{
border:1px solid #ff5252;
background:rgba(255,82,82,.12);
}

.orange{
border:1px solid #ffc107;
background:rgba(255,193,7,.12);
}

.label{
opacity:.7;
font-size:14px;
margin-bottom:8px;
}

.value{
font-size:28px;
font-weight:700;
}

.section{
margin-top:25px;
}

.section h2{
margin-bottom:15px;
font-size:32px;
}

.buttons{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
}

.btn{
height:70px;
border:none;
border-radius:18px;
background:#111827;
color:white;
font-size:24px;
font-weight:700;
cursor:pointer;
border:1px solid rgba(255,255,255,.08);
}

.btn.active{
border:2px solid #00e5ff;
box-shadow:0 0 25px rgba(0,229,255,.3);
}

.connect{
width:100%;
height:75px;
margin-top:20px;
border:none;
border-radius:20px;
font-size:24px;
font-weight:700;
background:linear-gradient(90deg,#00c6ff,#0072ff);
color:white;
cursor:pointer;
}

.status{
text-align:center;
margin-top:15px;
font-size:18px;
color:#44ff99;
}

.copy{
width:100%;
margin-top:15px;
height:60px;
border:none;
border-radius:18px;
background:#00bcd4;
color:white;
font-size:18px;
font-weight:700;
cursor:pointer;
}
</style>
</head>
<body>

<div class="logo">Riot VPN</div>

<div class="card">

<div class="user">
<div class="check">✓</div>
<div>
<div class="name">КАЗБЕК</div>
<div class="exp">Истекает через 14 месяцев</div>
</div>
</div>

<div class="grid">

<div class="box blue">
<div class="label">Имя пользователя</div>
<div class="value">KAZBEK</div>
</div>

<div class="box green">
<div class="label">Статус</div>
<div class="value">Активна</div>
</div>

<div class="box red">
<div class="label">Истекает</div>
<div class="value">07.09.2026</div>
</div>

<div class="box orange">
<div class="label">Трафик</div>
<div class="value">∞ GB</div>
</div>

</div>

<div class="section">

<h2>Установка</h2>

<div class="buttons">
<button class="btn active">HAPP</button>
<button class="btn">Shadowrocket</button>
<button class="btn">v2RayTun</button>
<button class="btn">iOS</button>
</div>

<button class="connect" onclick="connectVPN()">
CONNECT
</button>

<div class="status" id="status">
Не подключено
</div>

<button class="copy" onclick="copySub()">
Копировать подписку
</button>

</div>

</div>

<script>

const subscription =
"https://raw.githubusercontent.com/seitcomaev359-sudo/Net09/Boza09/Get.txt/Test09";

function copySub(){
navigator.clipboard.writeText(subscription);
alert("Подписка скопирована");
}

function connectVPN(){

const status=document.getElementById("status");

status.innerHTML="Подключение...";

setTimeout(()=>{
status.innerHTML="Подключено ✓";
window.open(subscription,"_blank");
},1500);

}

</script>

</body>
</html>
