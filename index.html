<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Riot VPN</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:-apple-system,BlinkMacSystemFont,sans-serif;
}

body{
background:#07111f;
min-height:100vh;
padding:20px;
color:white;
display:flex;
justify-content:center;
align-items:center;
}

.logo{
font-size:38px;
font-weight:700;
color:#3dcfff;
margin-bottom:20px;
text-align:center;
text-shadow:0 0 20px rgba(61,207,255,.5);
}

.card{
width:100%;
max-width:500px;
background:rgba(17,24,39,.95);
border:1px solid rgba(255,255,255,.05);
border-radius:25px;
padding:20px;
box-shadow:0 0 40px rgba(0,255,255,.08);
backdrop-filter:blur(15px);
}

.user{
display:flex;
align-items:center;
gap:15px;
margin-bottom:20px;
}

.check{
width:55px;
height:55px;
border-radius:50%;
background:#0d3f37;
display:flex;
align-items:center;
justify-content:center;
font-size:26px;
color:#44ff99;
box-shadow:0 0 20px rgba(68,255,153,.4);
}

.name{
font-size:30px;
font-weight:700;
}

.exp{
opacity:.7;
font-size:15px;
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
}

.box{
padding:16px;
border-radius:18px;
backdrop-filter:blur(15px);
}

.blue{
border:1px solid #2979ff;
background:rgba(41,121,255,.12);
}

.green{
border:1px solid #00e676;
background:rgba(0,230,118,.12);
}

.red{
border:1px solid #ff5252;
background:rgba(255,82,82,.12);
}

.orange{
border:1px solid #ffc107;
background:rgba(255,193,7,.12);
}

.label{
opacity:.7;
font-size:14px;
margin-bottom:8px;
}

.value{
font-size:22px;
font-weight:700;
word-break:break-word;
}

.section{
margin-top:25px;
}

.copy{
width:100%;
height:65px;
border:none;
border-radius:18px;
background:linear-gradient(90deg,#00c6ff,#0072ff);
color:white;
font-size:20px;
font-weight:700;
cursor:pointer;
box-shadow:0 0 25px rgba(0,198,255,.35);
transition:.3s;
}

.copy:hover{
transform:translateY(-2px);
}

.copy:active{
transform:scale(.98);
}
</style>
</head>
<body>

<div>

<div class="logo">Riot VPN</div>

<div class="card">

<div class="user">
<div class="check">✓</div>
<div>
<div class="name">TG:SEIT099</div>
<div class="exp">Истекает через 14 месяцев</div>
</div>
</div>

<div class="grid">

<div class="box blue">
<div class="label">Имя пользователя</div>
<div class="value">TG:SEIT099</div>
</div>

<div class="box green">
<div class="label">Статус</div>
<div class="value">Активна</div>
</div>

<div class="box red">
<div class="label">Истекает</div>
<div class="value">07.09.2026</div>
</div>

<div class="box orange">
<div class="label">Трафик</div>
<div class="value">∞ GB</div>
</div>

</div>

<div class="section">

<button class="copy" onclick="copySub()">
📋 Копировать подписку
</button>

</div>

</div>

</div>

<script>

const subscription =
"https://raw.githubusercontent.com/seitcomaev359-sudo/Net09/Boza09/Get.txt/Test09";

function copySub(){
navigator.clipboard.writeText(subscription);
alert("Подписка скопирована");
}

</script>

</body>
</html>
